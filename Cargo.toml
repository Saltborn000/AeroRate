[package]
name = "aerorate"
version = "0.1.0"
edition = "2024"
authors = ["Zohran"]
description = "Ultra-fast, lock-free atomic GCRA rate limiter with sub-10ns latency and zero allocations."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Saltborn000/AeroRate"
homepage = "https://github.com/Saltborn000/AeroRate"
documentation = "https://docs.rs/aerorate"
keywords = ["rate-limiter", "gcra", "concurrency", "lock-free", "token-bucket"]
categories = ["network-programming", "concurrency", "web-programming"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
ahash = "0.8.12"
parking_lot = "0.12.5"
serde = { version = "1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "rate_limit_throughput"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
